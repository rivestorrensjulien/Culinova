name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Lint, types, tests, build, bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: culinova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Valeurs de test uniquement (aucune vraie clé).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/culinova
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/culinova_test
      DATABASE_URL_E2E: postgresql://postgres:postgres@localhost:5432/culinova_e2e_test
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Formatage
        # En cas d'écart, chaque fichier concerné est signalé par une annotation lisible sur GitHub.
        run: |
          if ! pnpm format:check; then
            pnpm exec prettier --list-different . | sed 's/^/::error file=/;s/$/::Formatage Prettier à corriger (pnpm format)/'
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Vérification des types
        run: pnpm typecheck

      - name: Bases de test
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "create database culinova_test;"
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "create database culinova_e2e_test;"

      - name: Migrations et données de référence
        run: pnpm db:migrate && pnpm db:seed

      - name: Tests (unitaires et intégration)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Navigateur pour les tests de bout en bout
        run: pnpm --filter @culinova/web exec playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: pnpm test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
