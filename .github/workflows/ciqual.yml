name: Données Ciqual

# Télécharge la table Ciqual (ANSES), la convertit en un fichier compact
# (packages/db/src/seed/data/ciqual.json) et l'enregistre dans le dépôt.
# Le fichier est ensuite chargé en base à chaque déploiement (seed).
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Facultatif : archive ZIP XML (sinon, dernière version publiée sur recherche.data.gouv)"
        default: ""

permissions:
  contents: write

jobs:
  import:
    name: Import de la table Ciqual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Téléchargement
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          # Table Ciqual de l'ANSES sur recherche.data.gouv (fichiers XML de la dernière version).
          DATAVERSE: https://entrepot.recherche.data.gouv.fr
          DOI: doi:10.57745/RDMHWY
        run: |
          mkdir -p ciqual
          if [ -n "$SOURCE_URL" ]; then
            curl -sSL --fail --max-time 300 -o ciqual.zip "$SOURCE_URL"
            unzip -o -q ciqual.zip -d ciqual
          else
            curl -sSL --fail --max-time 60 -o files.json \
              "$DATAVERSE/api/datasets/:persistentId/versions/:latest/files?persistentId=$DOI"
            node -e '
              const files = JSON.parse(require("fs").readFileSync("files.json", "utf8")).data;
              for (const f of files)
                if (/^(alim|compo|const)_[\d_]+\.xml$/i.test(f.label)) console.log(`${f.dataFile.id} ${f.label}`);
            ' > wanted.txt
            while read -r id label; do
              curl -sSL --fail --max-time 300 -o "ciqual/$label" "$DATAVERSE/api/access/datafile/$id"
            done < wanted.txt
          fi
          find ciqual -type f -printf '::notice::%p (%s octets)\n'
          VERSION=$(ls ciqual | grep -oE '[0-9]{4}_[0-9]{2}_[0-9]{2}' | head -1 | tr _ -)
          echo "VERSION=${VERSION:-inconnue}" >> "$GITHUB_ENV"

      - name: Conversion
        run: node packages/db/scripts/ciqual-convert.mjs ciqual packages/db/src/seed/data/ciqual.json "$VERSION"

      - name: Enregistrement dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/seed/data/ciqual.json
          if git diff --cached --quiet; then echo "::notice::Aucun changement"; exit 0; fi
          git commit -m "Mettre à jour la table Ciqual ($VERSION)"
          git push
