name: Comparatif vidéo

# Deux vidéos d'une même recette, pour choisir le style : animée (Julien dessiné) et
# réaliste (Chef Ju en 3D dans une vraie cuisine, clips vidéo IA de fal.ai, environ 3 €).
# Rien n'est envoyé à Culinova ni publié : les fichiers vont sur la branche comparatif-video.
on:
  workflow_dispatch:
    inputs:
      recette:
        description: "Identifiant ou morceau du nom de la recette (vide : la première « à publier »)"
        required: false
      economique:
        description: "Version réaliste économique (3 plans filmés, ≈ 1,50 €)"
        type: boolean
        default: false
      cle:
        description: "Numéro du plan « signature » filmé en version économique (vide : choisi automatiquement)"
        required: false
      musique:
        description: "Composer 4 musiques de fond à écouter (≈ 0,80 €)"
        type: boolean
        default: false
      envoyer:
        description: "Envoyer la vidéo du comparatif à Culinova comme vidéo de la recette (à valider avant publication)"
        type: boolean
        default: false
      fichier:
        description: "Vidéo à envoyer (vide : D-format-eclate.mp4)"
        required: false
      reprendre:
        description: "Vue éclatée : reprendre les clips de la fabrication précédente (seules les lèvres sont refaites)"
        type: boolean
        default: false
      mascotte3d:
        description: "Propositions de Chef Ju en 3D, bras croisés (≈ 0,20 €)"
        type: boolean
        default: false
      eclate:
        description: "Format court « vue éclatée » (≈ 1,20 €)"
        type: boolean
        default: false
      retouche_plan:
        description: "Refaire seulement ce plan filmé de la version économique (numéro du plan, ≈ 0,40 €)"
        required: false
      consigne:
        description: "Consigne en plus pour la retouche (en anglais de préférence)"
        required: false
      animee:
        description: "Version animée seule (gratuit, sans fal.ai)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: comparatif
  cancel-in-progress: false

jobs:
  comparatif:
    name: Fabriquer les deux versions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agent
    env:
      CULINOVA_URL: ${{ vars.CULINOVA_URL || 'https://culinova.fr' }}
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      VESTE: ${{ vars.MASCOTTE_VESTE || 'blanche' }}
      RECETTE: ${{ inputs.recette }}
      ANIMEE: ${{ inputs.animee && '1' || '0' }}
      ECONOMIQUE: ${{ inputs.economique && '1' || '0' }}
      CLE: ${{ inputs.cle }}
      RETOUCHE: ${{ inputs.retouche_plan }}
      CONSIGNE: ${{ inputs.consigne }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installation du studio vidéo
        run: npm install --no-audit --no-fund
      - name: Vérifications
        run: npm run typecheck && npm test
      - name: Fabrication des deux vidéos
        if: inputs.retouche_plan == '' && !inputs.eclate && !inputs.mascotte3d && !inputs.envoyer && !inputs.musique
        run: npm run comparatif -- --recette="$RECETTE" --animee="$ANIMEE" --economique="$ECONOMIQUE" --cle="$CLE"
      - name: Musiques de fond
        if: inputs.musique
        run: npm run musique
      - name: Envoi à Culinova
        if: inputs.envoyer
        env:
          FICHIER: ${{ inputs.fichier }}
        run: |
          git clone -q --depth 1 -b comparatif-video "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/precedent
          mkdir -p sortie/comparatif && cp -r /tmp/precedent/. sortie/comparatif/ && rm -rf sortie/comparatif/.git
          npm run envoyer -- --recette="$RECETTE" --fichier="$FICHIER"
      - name: Chef Ju en 3D
        if: inputs.mascotte3d
        run: npm run mascotte3d
      - name: Format « vue éclatée »
        if: inputs.eclate
        run: |
          if [ "${{ inputs.reprendre }}" = "true" ]; then
            git clone -q --depth 1 -b comparatif-video "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/precedent
            mkdir -p sortie/comparatif && cp -r /tmp/precedent/. sortie/comparatif/ && rm -rf sortie/comparatif/.git
            npm run eclate -- --recette="$RECETTE" --reprendre=1
          else
            npm run eclate -- --recette="$RECETTE"
          fi
      - name: Retouche d'un plan
        if: inputs.retouche_plan != ''
        run: |
          git clone -q --depth 1 -b comparatif-video "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/precedent
          mkdir -p sortie/comparatif && cp -r /tmp/precedent/. sortie/comparatif/ && rm -rf sortie/comparatif/.git
          npm run retouche -- --recette="$RECETTE" --plan="$RETOUCHE" --cle="$CLE" --consigne="$CONSIGNE"
      - name: Fichiers (téléchargeables)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparatif-video
          path: agent/sortie/comparatif/
          if-no-files-found: ignore
          retention-days: 2
      - name: Fichiers sur la branche comparatif-video
        # On garde les fichiers déjà présents (clips, images) et on ajoute ou remplace les nouveaux.
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if ! git clone -q --depth 1 -b comparatif-video "$url" /tmp/comparatif 2>/dev/null; then
            mkdir -p /tmp/comparatif && git -C /tmp/comparatif init -q -b comparatif-video
          fi
          cp -r sortie/comparatif/. /tmp/comparatif/
          cd /tmp/comparatif
          git config user.name "Agent Culinova"
          git config user.email "agent@culinova.fr"
          git add -A && git commit -qm "Comparatif vidéo (${GITHUB_SHA::7})" || echo "Rien de nouveau"
          git push -q "$url" HEAD:comparatif-video
